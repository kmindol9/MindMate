<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>MindMate 분석 결과</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<nav class="top-nav">
    <div class="top-nav-container">
        <a class="top-logo" href="/">
            <span class="top-logo-title">MindMate</span>
            <span class="top-logo-subtitle">AI Decision Support System</span>
        </a>

        <div class="top-menu">
            <a class="top-link" href="/">MindMate 소개</a>

            <a class="top-link"
               th:classappend="${mode == 'counsel'} ? ' active' : ''"
               href="/counsel">고민 분석</a>

            <a class="top-link"
               th:classappend="${mode == 'decision'} ? ' active' : ''"
               href="/decision">간단 의사결정</a>

            <a class="top-link" href="/privacy">개인정보 안내</a>
        </div>
    </div>
</nav>

<div class="page-wrapper">

    <header class="result-header">
        <div class="brand-badge">MindMate Report</div>

        <h1 th:if="${mode == 'decision'}">
            의사결정 분석 결과
        </h1>

        <h1 th:unless="${mode == 'decision'}">
            고민 분석 결과
        </h1>

        <p th:if="${mode == 'decision'}">
            입력한 선택 상황을 바탕으로 장단점, 판단 기준, 현실적인 방향을 정리했습니다.
        </p>

        <p th:unless="${mode == 'decision'}">
            입력한 고민을 바탕으로 감정, 문제 유형, 핵심 원인과 대안을 정리했습니다.
        </p>
    </header>

    <pre id="rawResult"
         class="raw-result"
         th:text="${result}"></pre>

    <main id="resultCards" class="result-cards"></main>

</div>

<script src="/js/result.js"></script>

</body>
</html>
